name: Publicar #105 (domingo)

on:
  schedule:
    - cron: '47 11 * * 0'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p main/001-100/105.Ventas
          cp pendientes/001-100/105.Ventas/Ventas.java main/001-100/105.Ventas/
          cd main
          git add 001-100/105.Ventas/Ventas.java
          git commit -m "#105 - Ventas"
          git push origin main
