name: Publicar #120 (sabado)

on:
  schedule:
    - cron: '12 9 * * 6'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "main/001-100/120.Constante magica"
          cp "pendientes/001-100/120.Constante magica/ConstanteMagica.java" "main/001-100/120.Constante magica/"
          cd main
          git add "001-100/120.Constante magica/ConstanteMagica.java"
          git commit -m "#120 - Constante magica"
          git push origin main