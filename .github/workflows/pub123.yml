name: Publicar #123 (martes)

on:
  schedule:
    - cron: '12 9 * * 2'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "main/001-100/123.Conjugar verbos"
          cp "pendientes/001-100/123.Conjugar verbos/ConjugarVerbos.java" "main/001-100/123.Conjugar verbos/"
          cd main
          git add "001-100/123.Conjugar verbos/ConjugarVerbos.java"
          git commit -m "#123 - Conjugar verbos"
          git push origin main