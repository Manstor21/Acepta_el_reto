name: Publicar #122 (lunes)

on:
  schedule:
    - cron: '12 9 * * 1'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "main/001-100/122.Avituallamiento en las etapas ciclistas"
          cp "pendientes/001-100/122.Avituallamiento en las etapas ciclistas/Avituallamiento.java" "main/001-100/122.Avituallamiento en las etapas ciclistas/"
          cd main
          git add "001-100/122.Avituallamiento en las etapas ciclistas/Avituallamiento.java"
          git commit -m "#122 - Avituallamiento en las etapas ciclistas"
          git push origin main