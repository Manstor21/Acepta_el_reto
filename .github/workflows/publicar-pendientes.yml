name: Publicar pendientes

on:
  schedule:
    - cron: '12 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v5
        with:
          ref: main
          path: main

      - name: Mover problemas pendientes a main
        run: |
          cd main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          publicado=false
          for carpeta in ../pendientes/001-100/*/; do
            nombre="$(basename "$carpeta")"
            if [ ! -d "001-100/$nombre" ]; then
              mkdir -p "001-100/$nombre"
              cp "$carpeta"*.java "001-100/$nombre/"
              num="${nombre%%.*}"
              titulo="${nombre#*.}"
              archivo="$(ls "$carpeta" | grep '\.java$' | head -n1)"

              git add "001-100/$nombre"/
              git commit -m "#$num - $titulo"

              # Anadir fila al README (nombre sin acentos, derivado de la carpeta)
              # awk inserta la fila y una linea en blanco antes de "## Lenguaje"
              fila="| $num | $titulo | \`$archivo\` |"
              awk -v fila="$fila" '/^## Lenguaje$/ { print fila; print "" } { print }' README.md > README.tmp && mv README.tmp README.md
              git add README.md
              git commit -m "Actualizar README con #$num"

              echo "Publicado: $nombre"
              publicado=true
            fi
          done

          if [ "$publicado" = "true" ]; then
            # Actualizar contador de resueltos en la tabla de Progreso
            resueltos=$(grep -cE '^\| [0-9]{3,} \|' README.md | tr -d ' ')
            sed -i -E "s/^\| 1 \| 100-199 \| [0-9]+\/100 \|$/| 1 | 100-199 | ${resueltos}\/100 |/" README.md
            git add README.md
            git commit -m "Actualizar progreso en README" || true

            git pull --rebase origin main
            git push origin main
          else
            echo "No hay problemas pendientes."
          fi