name: Publicar pendientes

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      publicar_ahora:
        description: 'Sin retardo aleatorio (para validacion manual)'
        required: false
        type: boolean
        default: false
      retardo_max:
        description: 'Tope del retardo aleatorio en segundos (solo pruebas). El cron ignora este input y usa 14400.'
        required: false
        type: number
        default: 14400

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (SHA fijo: la tag@v5 dejo de resolver en runs schedule)
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (SHA fijo: la tag@v5 dejo de resolver en runs schedule)
        with:
          ref: main
          path: main

      - name: Publicar un problema al dia a hora normal aleatoria
        run: |
          # El cron dispara a las 09:00 UTC. Un retardo aleatorio de 0 a 4 horas
          # reparte la publicacion entre ~09:00 y ~13:00 UTC (~10:00-15:00 hora de Espana),
          # siempre en horario normal y por debajo del timeout del job.
          # El cron NO pasa inputs: maximo por defecto 14400. El input retardo_max solo
          # existe para probar esta misma rama con un retardo corto desde workflow_dispatch.
          max_retardo="${{ github.event.inputs.retardo_max }}"
          if [ -z "$max_retardo" ]; then max_retardo=14400; fi
          if [ "${{ github.event.inputs.publicar_ahora }}" = "true" ]; then
            retardo=0
            echo "Dispatch manual sin retardo: publicando ahora"
          else
            retardo=$(( RANDOM % max_retardo ))
            echo "Retardo aleatorio: ${retardo}s de un maximo de ${max_retardo}s (~$(( retardo / 3600 ))h) antes de publicar"
          fi
          sleep "$retardo"

          cd main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          publicado=false
          for carpeta in ../pendientes/001-100/*/; do
            nombre="$(basename "$carpeta")"
            if [ ! -d "001-100/$nombre" ]; then
              mkdir -p "001-100/$nombre"
              cp "$carpeta"*.java "001-100/$nombre/"
              num="${nombre%%.*}"
              titulo="${nombre#*.}"
              archivo="$(ls "$carpeta" | grep '\.java$' | head -n1)"

              git add "001-100/$nombre"/
              git commit -m "#$num - $titulo"

              # Anadir fila al README (nombre sin acentos, derivado de la carpeta)
              # Insertar la fila despues de la ultima fila de la tabla (linea "| NNN |")
              # Enlace al archivo: ruta relativa con espacios como %20
              ruta="001-100/${nombre// /%20}/$archivo"
              fila="| $num | $titulo | [\`$archivo\`]($ruta) |"
              ultima=$(grep -nE '^\| [0-9]{3} ' README.md | tail -1 | cut -d: -f1)
              sed -i "${ultima}a $fila" README.md
              git add README.md
              git commit -m "Actualizar README con #$num"

              echo "Publicado: $nombre"
              publicado=true
              # Solo UN problema por ejecucion: el resto queda para los proximos dias.
              break
            fi
          done

          if [ "$publicado" = "true" ]; then
            # Actualizar contador de resueltos en la tabla de Progreso
            resueltos=$(grep -cE '^\| [0-9]{3,} \|' README.md | tr -d ' ')
            sed -i -E "s/^\| 1 \| 100-199 \| [0-9]+\/100 \|$/| 1 | 100-199 | ${resueltos}\/100 |/" README.md
            # Actualizar el contador del resumen del bloque plegable
            sed -i -E "s/\(([0-9]+\/100)\)/(${resueltos}\/100)/" README.md
            git add README.md
            git commit -m "Actualizar progreso en README" || true

            git pull --rebase origin main
            git push origin main
          else
            echo "No hay problemas pendientes."
          fi
