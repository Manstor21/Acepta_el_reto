name: Publicar #132 (jueves)

on:
  schedule:
    - cron: '12 9 * * 4'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "main/001-100/132.Las cartas del abuelo"
          cp "pendientes/001-100/132.Las cartas del abuelo/CartasAbuelo.java" "main/001-100/132.Las cartas del abuelo/"
          cd main
          git add "001-100/132.Las cartas del abuelo/CartasAbuelo.java"
          git commit -m "#132 - Las cartas del abuelo"
          git push origin main