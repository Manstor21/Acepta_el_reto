name: Publicar #111 (martes)

on:
  schedule:
    - cron: '38 15 * * 2'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p main/001-100/111.Aprobar quimica
          cp pendientes/001-100/111.Aprobar quimica/Quimica.java main/001-100/111.Aprobar quimica/
          cd main
          git add 001-100/111.Aprobar quimica/Quimica.java
          git commit -m "#111 - Aprobar quimica"
          git push origin main
