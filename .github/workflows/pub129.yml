name: Publicar #129 (lunes)

on:
  schedule:
    - cron: '12 9 * * 1'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "main/001-100/129.Marcadores de 7 segmentos"
          cp "pendientes/001-100/129.Marcadores de 7 segmentos/Marcadores7Segmentos.java" "main/001-100/129.Marcadores de 7 segmentos/"
          cd main
          git add "001-100/129.Marcadores de 7 segmentos/Marcadores7Segmentos.java"
          git commit -m "#129 - Marcadores de 7 segmentos"
          git push origin main