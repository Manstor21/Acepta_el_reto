name: Publicar #104 (sabado)

on:
  schedule:
    - cron: '23 14 * * 6'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p main/001-100/104.Moviles
          cp pendientes/001-100/104.Moviles/Moviles.java main/001-100/104.Moviles/
          cd main
          git add 001-100/104.Moviles/Moviles.java
          git commit -m "#104 - Moviles"
          git push origin main
