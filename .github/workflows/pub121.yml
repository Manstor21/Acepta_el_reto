name: Publicar #121 (domingo)

on:
  schedule:
    - cron: '12 9 * * 0'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "main/001-100/121.Chicles de regalo"
          cp "pendientes/001-100/121.Chicles de regalo/Chicles.java" "main/001-100/121.Chicles de regalo/"
          cd main
          git add "001-100/121.Chicles de regalo/Chicles.java"
          git commit -m "#121 - Chicles de regalo"
          git push origin main