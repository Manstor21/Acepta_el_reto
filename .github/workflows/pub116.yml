name: Publicar #116 (martes)

on:
  schedule:
    - cron: '12 9 * * 2'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "main/001-100/116.Hola mundo"
          cp "pendientes/001-100/116.Hola mundo/HolaMundo.java" "main/001-100/116.Hola mundo/"
          cd main
          git add "001-100/116.Hola mundo/HolaMundo.java"
          git commit -m "#116 - Hola mundo"
          git push origin main