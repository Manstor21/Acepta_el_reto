name: Publicar #127 (sabado)

on:
  schedule:
    - cron: '12 9 * * 6'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "main/001-100/127.Una dola tela catola"
          cp "pendientes/001-100/127.Una dola tela catola/Cantinela.java" "main/001-100/127.Una dola tela catola/"
          cd main
          git add "001-100/127.Una dola tela catola/Cantinela.java"
          git commit -m "#127 - Una dola tela catola"
          git push origin main