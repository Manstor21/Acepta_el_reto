name: Publicar #126 (viernes)

on:
  schedule:
    - cron: '12 9 * * 5'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "main/001-100/126.Divisores del factorial"
          cp "pendientes/001-100/126.Divisores del factorial/DivisoresFactorial.java" "main/001-100/126.Divisores del factorial/"
          cd main
          git add "001-100/126.Divisores del factorial/DivisoresFactorial.java"
          git commit -m "#126 - Divisores del factorial"
          git push origin main