name: Publicar #112 (miercoles)

on:
  schedule:
    - cron: '55 13 * * 3'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendientes
          path: pendientes

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p main/001-100/112.Radares de tramo
          cp pendientes/001-100/112.Radares de tramo/Radares.java main/001-100/112.Radares de tramo/
          cd main
          git add 001-100/112.Radares de tramo/Radares.java
          git commit -m "#112 - Radares de tramo"
          git push origin main
